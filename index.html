<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Invest - Admin Ultimate Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #22c55e; --bg: #0f172a; --card: #1e293b; --red: #ef4444; --blue: #3b82f6; --yellow: #facc15; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background: var(--bg); color: white; padding: 15px; }
        .header { background: var(--red); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; font-weight: 800; font-size: 20px; }
        
        h3 { margin: 20px 0 10px; color: var(--yellow); border-left: 4px solid var(--primary); padding-left: 10px; font-size: 18px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .flex-buttons { display: flex; gap: 8px; margin-top: 10px; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; color: white; font-size: 13px; }
        
        .btn-approve { background: var(--primary); }
        .btn-reject { background: var(--red); }
        .btn-ban { background: #64748b; }
        .btn-cut { background: #f97316; }

        .user-info p { font-size: 14px; margin-bottom: 4px; }
        .balance-tag { color: var(--primary); font-weight: 700; }
        
        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 5px; border-radius: 5px; width: 80px; }
    </style>
</head>
<body>

    <div class="header">SMART INVEST ADMIN PRO</div>

    <h3>📥 ডিপোজিট রিকোয়েস্ট (বোনাস সহ)</h3>
    <div id="depositList">লোডিং...</div>

    <h3>📤 উইথড্র রিকোয়েস্ট (পাশাপাশি বাটন)</h3>
    <div id="withdrawList">লোডিং...</div>

    <h3>👥 ইউজার ম্যানেজ (ব্যান ও ব্যালেন্স কাটা)</h3>
    <div id="userList">লোডিং...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, getDoc, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByoyfmwZJyIwYj09NdLwHLpsAVZ0joZq4",
            authDomain: "investmentc12-887a8.firebaseapp.com",
            projectId: "investmentc12-887a8",
            storageBucket: "investmentc12-887a8.firebasestorage.app",
            messagingSenderId: "235522350741",
            appId: "1:235522350741:web:c1c5b9417dd3875e7d059c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ১. ডিপোজিট ও রেফার বোনাস লজিক ---
        onSnapshot(query(collection(db, "transactions"), where("status", "==", "pending")), (snap) => {
            let html = "";
            snap.forEach(d => {
                const data = d.data();
                html += `
                <div class="card">
                    <p><b>ইমেল:</b> ${data.email}</p>
                    <p><b>পরিমাণ:</b> ৳${data.amount} | <b>Trx:</b> ${data.trxId}</p>
                    <div class="flex-buttons">
                        <button class="btn btn-approve" onclick="approveDeposit('${d.id}', '${data.uid}', ${data.amount})">Approve + Bonus</button>
                        <button class="btn btn-reject" onclick="processRequest('transactions', '${d.id}', 'rejected')">Reject</button>
                    </div>
                </div>`;
            });
            document.getElementById('depositList').innerHTML = html || "কোনো রিকোয়েস্ট নেই";
        });

        async function distributeBonus(uid) {
            const rates = [30, 15, 7.5, 3.7, 1.8]; 
            let nextUid = uid;
            for (let i = 0; i < rates.length; i++) {
                const s = await getDoc(doc(db, "users", nextUid));
                if (!s.exists()) break;
                const ref = s.data().referrer;
                if (!ref) break;
                await updateDoc(doc(db, "users", ref), { balance: increment(rates[i]) });
                nextUid = ref;
            }
        }

        window.approveDeposit = async (id, uid, amt) => {
            if(!confirm("অ্যাপ্রুভ করবেন?")) return;
            await updateDoc(doc(db, "transactions", id), { status: "approved" });
            await updateDoc(doc(db, "users", uid), { active: true, balance: increment(amt) });
            await distributeBonus(uid);
            alert("সফল!");
        };

        // --- ২. উইথড্র ম্যানেজমেন্ট (পাশাপাশি বাটন) ---
        onSnapshot(query(collection(db, "withdrawals"), where("status", "==", "pending")), (snap) => {
            let html = "";
            snap.forEach(d => {
                const data = d.data();
                html += `
                <div class="card">
                    <p><b>ইউজার:</b> ${data.email}</p>
                    <p><b>৳${data.amount}</b> (${data.method}) -> ${data.number}</p>
                    <div class="flex-buttons">
                        <button class="btn btn-approve" onclick="processRequest('withdrawals', '${d.id}', 'approved')">Paid (Approve)</button>
                        <button class="btn btn-reject" onclick="rejectWithdraw('${d.id}', '${data.uid}', ${data.amount})">Reject (Refund)</button>
                    </div>
                </div>`;
            });
            document.getElementById('withdrawList').innerHTML = html || "কোনো রিকোয়েস্ট নেই";
        });

        window.rejectWithdraw = async (id, uid, amt) => {
            if(!confirm("রিজেক্ট করবেন? টাকা ফেরত যাবে।")) return;
            await updateDoc(doc(db, "withdrawals", id), { status: "rejected" });
            await updateDoc(doc(db, "users", uid), { balance: increment(amt) });
        };

        // --- ৩. ইউজার ম্যানেজমেন্ট (ব্যান, একটিভ, ব্যালেন্স কাটা) ---
        onSnapshot(collection(db, "users"), (snap) => {
            let html = "";
            snap.forEach(d => {
                const data = d.data();
                html += `
                <div class="card">
                    <div class="user-info">
                        <p><b>নাম:</b> ${data.name} <span class="balance-tag">| ৳${data.balance.toFixed(2)}</span></p>
                        <p style="font-size:11px;">ID: ${d.id}</p>
                        <p>স্ট্যাটাস: ${data.active ? '✅ Active' : '❌ Banned/Inactive'}</p>
                    </div>
                    <div class="flex-buttons">
                        <button class="btn btn-ban" onclick="toggleUser('${d.id}', ${!data.active})">${data.active ? 'Ban' : 'Active'}</button>
                        <div style="display:flex; align-items:center; gap:5px;">
                            <input type="number" id="cut_${d.id}" placeholder="৳">
                            <button class="btn btn-cut" onclick="cutBalance('${d.id}')">কাটা</button>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('userList').innerHTML = html;
        });

        window.toggleUser = async (id, status) => {
            await updateDoc(doc(db, "users", id), { active: status });
        };

        window.cutBalance = async (id) => {
            const amt = document.getElementById('cut_'+id).value;
            if(!amt || amt <= 0) return alert("সঠিক পরিমাণ দিন");
            await updateDoc(doc(db, "users", id), { balance: increment(-Number(amt)) });
            alert("ব্যালেন্স কাটা হয়েছে");
            document.getElementById('cut_'+id).value = "";
        };

        window.processRequest = async (col, id, stat) => {
            await updateDoc(doc(db, col, id), { status: stat });
            alert("আপডেট হয়েছে");
        };

    </script>
</body>
</html>
