<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Invest - Admin Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #22c55e; --bg: #0f172a; --card: #1e293b; --red: #ef4444; --yellow: #facc15; --blue: #3b82f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background: var(--bg); color: white; -webkit-user-select: none; user-select: none; }

        .tab-container { display: flex; background: var(--card); position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid #334155; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 15px 10px; border: none; background: none; color: #94a3b8; font-weight: 700; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: rgba(34, 197, 94, 0.1); }

        .content-section { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .content-section.active { display: block; }

        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        .flex-buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 12px 8px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; color: white; font-size: 12px; }
        
        .btn-approve { background: var(--primary); }
        .btn-reject { background: var(--red); }
        .btn-ban { background: #64748b; }
        .btn-add { background: var(--blue); }
        .btn-cut { background: #f97316; }

        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input { flex: 1; max-width: none; background: var(--card); padding: 12px; border: 1px solid var(--primary); }
        
        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; width: 100%; outline: none; }
        .info-label { color: #94a3b8; font-size: 12px; margin-top: 5px; }
        
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    </style>
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) return false;
        };
    </script>
</head>
<body>

    <div class="tab-container">
        <button class="tab-btn active" onclick="openTab(event, 'depTab')">ডিপোজিট</button>
        <button class="tab-btn" onclick="openTab(event, 'witTab')">উইথড্র</button>
        <button class="tab-btn" onclick="openTab(event, 'userTab')">সব ইউজার</button>
        <button class="tab-btn" onclick="openTab(event, 'searchTab')" style="color:var(--yellow)">🔍 সার্চ কন্ট্রোল</button>
    </div>

    <div id="depTab" class="content-section active">
        <h3 style="margin-bottom:10px; color:var(--yellow)">📥 পেন্ডিং ডিপোজিট</h3>
        <div id="depositList">লোডিং...</div>
    </div>

    <div id="witTab" class="content-section">
        <h3 style="margin-bottom:10px; color:var(--yellow)">📤 পেন্ডিং উইথড্র</h3>
        <div id="withdrawList">লোডিং...</div>
    </div>

    <div id="userTab" class="content-section">
        <h3 style="margin-bottom:10px; color:var(--yellow)">👥 ইউজার লিস্ট</h3>
        <div id="userList">লোডিং...</div>
    </div>

    <div id="searchTab" class="content-section">
        <h3 style="margin-bottom:10px; color:var(--primary)">🔍 ইউজার সার্চ ও স্পেশাল কন্ট্রোল</h3>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ইমেল বা নাম লিখুন...">
            <button class="btn btn-approve" onclick="searchUser()" style="flex:none; width:80px;">খুঁজুন</button>
        </div>
        <div id="searchResult"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, getDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByoyfmwZJyIwYj09NdLwHLpsAVZ0joZq4",
            authDomain: "investmentc12-887a8.firebaseapp.com",
            projectId: "investmentc12-887a8",
            storageBucket: "investmentc12-887a8.firebasestorage.app",
            messagingSenderId: "235522350741",
            appId: "1:235522350741:web:c1c5b9417dd3875e7d059c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.openTab = (evt, tabName) => {
            let i, content, tabs;
            content = document.getElementsByClassName("content-section");
            for (i = 0; i < content.length; i++) content[i].classList.remove("active");
            tabs = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        };

        async function distributeReferBonus(uid) {
            const levels = [15, 10, 5, 2, 1]; 
            let currentUid = uid;
            for (let i = 0; i < levels.length; i++) {
                const userSnap = await getDoc(doc(db, "users", currentUid));
                if (!userSnap.exists()) break;
                const referrerUid = userSnap.data().referrer;
                if (!referrerUid) break;
                await updateDoc(doc(db, "users", referrerUid), { balance: increment(levels[i]) });
                currentUid = referrerUid;
            }
        }

        // ডিপোজিট লিস্ট
        onSnapshot(query(collection(db, "transactions"), where("status", "==", "pending")), (snap) => {
            let html = "";
            snap.forEach(d => {
                const data = d.data();
                html += `<div class="card"><p><b>UID:</b> ${data.uid}</p><p><b>Amount:</b> ৳${data.amount} | <b>Trx:</b> ${data.trxId}</p>
                <div class="flex-buttons">
                    <button class="btn btn-approve" onclick="approveDep('${d.id}', '${data.uid}', ${data.amount})">Approve</button>
                    <button class="btn btn-reject" onclick="updateStat('transactions', '${d.id}', 'rejected')">Reject</button>
                </div></div>`;
            });
            document.getElementById('depositList').innerHTML = html || "পেন্ডিং নেই";
        });

        window.approveDep = async (id, uid, amt) => {
            if(!confirm("অ্যাপ্রুভ করবেন?")) return;
            await updateDoc(doc(db, "transactions", id), { status: "approved" });
            await updateDoc(doc(db, "users", uid), { active: true, balance: increment(amt) });
            await distributeReferBonus(uid);
            alert("সফল!");
        };

        // উইথড্র লিস্ট
        onSnapshot(query(collection(db, "withdrawals"), where("status", "==", "pending")), (snap) => {
            let html = "";
            snap.forEach(d => {
                const data = d.data();
                html += `<div class="card"><p><b>Method:</b> ${data.method} | <b>Num:</b> ${data.number}</p><p><b>Amount:</b> ৳${data.amount}</p>
                <div class="flex-buttons">
                    <button class="btn btn-approve" onclick="updateStat('withdrawals', '${d.id}', 'approved')">Paid</button>
                    <button class="btn btn-reject" onclick="rejectWit('${d.id}', '${data.uid}', ${data.amount})">Reject</button>
                </div></div>`;
            });
            document.getElementById('withdrawList').innerHTML = html || "পেন্ডিং নেই";
        });

        window.rejectWit = async (id, uid, amt) => {
            if(!confirm("রিজেক্ট করবেন?")) return;
            await updateDoc(doc(db, "withdrawals", id), { status: "rejected" });
            await updateDoc(doc(db, "users", uid), { balance: increment(amt) });
        };

        // সব ইউজার লিস্ট
        onSnapshot(collection(db, "users"), (snap) => {
            let html = "";
            snap.forEach(d => {
                const data = d.data();
                html += `<div class="card"><p><b>${data.name}</b> (৳${data.balance.toFixed(2)})</p><p style="font-size:11px">Email: ${data.email}</p></div>`;
            });
            document.getElementById('userList').innerHTML = html;
        });

        // --- সার্চ ফাংশন ও স্পেশাল কন্ট্রোল ---
        window.searchUser = async () => {
            const term = document.getElementById('searchInput').value.trim();
            if(!term) return alert("কিছু লিখুন!");
            
            const qName = query(collection(db, "users"), where("name", "==", term));
            const qEmail = query(collection(db, "users"), where("email", "==", term));
            
            const [snapN, snapE] = await Promise.all([getDocs(qName), getDocs(qEmail)]);
            let userDoc = null;
            snapN.forEach(d => userDoc = d);
            if(!userDoc) snapE.forEach(d => userDoc = d);

            if(!userDoc) {
                document.getElementById('searchResult').innerHTML = "ইউজার পাওয়া যায়নি!";
                return;
            }

            const data = userDoc.data();
            const uid = userDoc.id;

            let html = `
            <div class="card" style="border: 1px solid var(--primary)">
                <h4 style="color:var(--primary)">${data.name}</h4>
                <p class="info-label">ইমেল: ${data.email}</p>
                <p class="info-label">UID: ${uid}</p>
                <h3 style="margin:10px 0">ব্যালেন্স: ৳${data.balance.toFixed(2)}</h3>
                <p>স্ট্যাটাস: ${data.active ? '✅ Active' : '❌ Banned/Inactive'}</p>
                
                <hr style="margin:15px 0; border:0; border-top:1px solid #334155">
                
                <div class="input-group">
                    <input type="number" id="modAmount" placeholder="টাকার পরিমাণ লিখুন">
                </div>
                <div class="flex-buttons">
                    <button class="btn btn-add" onclick="modifyBalance('${uid}', 'add')">৳ যোগ করুন</button>
                    <button class="btn btn-cut" onclick="modifyBalance('${uid}', 'cut')">৳ কেটে নিন</button>
                </div>
                
                <div class="flex-buttons" style="margin-top:15px">
                    <button class="btn btn-ban" onclick="changeUserStatus('${uid}', ${!data.active})">
                        ${data.active ? 'ইউজার ব্যান করুন' : 'অ্যাক্টিভ করুন'}
                    </button>
                </div>
            </div>`;
            document.getElementById('searchResult').innerHTML = html;
        };

        window.modifyBalance = async (uid, type) => {
            const amt = Number(document.getElementById('modAmount').value);
            if(!amt || amt <= 0) return alert("সঠিক পরিমাণ দিন");
            const finalAmt = type === 'add' ? amt : -amt;
            await updateDoc(doc(db, "users", uid), { balance: increment(finalAmt) });
            alert(type === 'add' ? "টাকা যোগ হয়েছে" : "টাকা কাটা হয়েছে");
            searchUser(); // রিফ্রেশ রেজাল্ট
        };

        window.changeUserStatus = async (uid, status) => {
            await updateDoc(doc(db, "users", uid), { active: status });
            alert("স্ট্যাটাস আপডেট হয়েছে");
            searchUser();
        };

        window.updateStat = async (col, id, s) => { await updateDoc(doc(db, col, id), { status: s }); alert("আপডেট হয়েছে"); };
    </script>
</body>
</html>
