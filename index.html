<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Smart Invest BD</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #22c55e; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

        .header { padding: 20px; background: var(--card); text-align: center; border-bottom: 1px solid #334155; }
        .container { padding: 15px; max-width: 500px; margin: 0 auto; }

        /* Modern Card UI */
        .card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-top: 20px; }
        .card-title { color: var(--primary); font-size: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px; }
        .input-group input { width: 100%; padding: 15px; background: #0f172a; border: 2px solid #334155; border-radius: 12px; color: white; transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary); outline: none; }

        .btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }
        .btn:active { transform: scale(0.98); }

        .hint { font-size: 12px; color: #64748b; margin-top: 15px; line-height: 1.6; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="color: var(--primary);">অ্যাডমিন প্যানেল</h2>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-title">🎯 ডেইলি টাস্ক কন্ট্রোল</div>
            <div class="input-group">
                <label>ইউজারের জন্য নতুন কাজের লিংক দিন:</label>
                <input type="text" id="taskUrlInput" placeholder="https://youtube.com/...">
            </div>
            <button class="btn" onclick="updateTaskLink()">লিংক আপডেট করুন</button>
            <div class="hint">
                * এখানে দেওয়া লিংকটি ইউজারের টাস্ক বাটনে সেট হয়ে যাবে।<br>
                * ইউজার লিংকে ক্লিক করে ৫ সেকেন্ড থাকলেই তার ব্যালেন্সে ১০ টাকা অটো যোগ হবে।
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // আপনার Firebase Config দিন
        const firebaseConfig = {
            apiKey: "AIzaSyByoyfmwZJyIwYj09NdLwHLpsAVZ0joZq4",
            authDomain: "investmentc12-887a8.firebaseapp.com",
            projectId: "investmentc12-887a8",
            storageBucket: "investmentc12-887a8.firebasestorage.app",
            messagingSenderId: "235522350741",
            appId: "1:235522350741:web:c1c5b9417dd3875e7d059c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // টাস্ক লিংক আপডেট ফাংশন (FIXED)
        window.updateTaskLink = async () => {
            const url = document.getElementById('taskUrlInput').value;
            if(!url) return alert("অনুগ্রহ করে একটি সঠিক লিংক দিন!");
            
            try {
                // 'settings' কালেকশনের 'taskConfig' ডকুমেন্টে সেভ করা হচ্ছে
                await setDoc(doc(db, "settings", "taskConfig"), { 
                    url: url,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                
                alert("সাফল্য! টাস্ক লিংকটি আপডেট করা হয়েছে।");
            } catch (error) {
                console.error("Error updating task: ", error);
                alert("আপডেট করতে সমস্যা হয়েছে! ইন্টারনেট কানেকশন চেক করুন।");
            }
        };

        // বর্তমান লিংকটি ইনপুট ফিল্ডে লোড করা
        const loadCurrentTask = async () => {
            const docRef = doc(db, "settings", "taskConfig");
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                document.getElementById('taskUrlInput').value = docSnap.data().url;
            }
        };
        loadCurrentTask();
    </script>
</body>
</html>
