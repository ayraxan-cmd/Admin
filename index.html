<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Invest BD - Super Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body { font-family: 'Hind Siliguri', sans-serif; background: #0f172a; color: #e2e8f0; }
        .sidebar { width: 250px; height: 100vh; background: #1e293b; position: fixed; padding: 20px; border-right: 1px solid #334155; }
        .main-content { margin-left: 250px; padding: 30px; }
        h1 { color: #22c55e; margin-bottom: 25px; font-size: 24px; }
        
        /* Navigation */
        .nav-item { padding: 12px; color: #94a3b8; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: #334155; color: white; }

        /* Tables & Cards */
        .section { display: none; }
        .section.active { display: block; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #334155; color: #22c55e; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: #fbbf24; color: #0f172a; }
        
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; margin-right: 5px; }
        .btn-approve { background: #22c55e; color: white; }
        .btn-reject { background: #ef4444; color: white; }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color: white; margin-bottom: 30px;">Admin Panel</h2>
        <div class="nav-item active" onclick="showSection('usersSection', this)">👥 ইউজার ইনফরমেশন</div>
        <div class="nav-item" onclick="showSection('depositSection', this)">📥 ডিপোজিট রিকোয়েস্ট</div>
        <div class="nav-item" onclick="showSection('withdrawSection', this)">📤 উইথড্র রিকোয়েস্ট</div>
    </div>

    <div class="main-content">
        <div id="usersSection" class="section active">
            <h1>সকল ইউজার লিস্ট</h1>
            <table>
                <thead>
                    <tr>
                        <th>নাম</th>
                        <th>ইমেল</th>
                        <th>ব্যালেন্স</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>

        <div id="depositSection" class="section">
            <h1>ডিপোজিট রিকোয়েস্ট (Pending)</h1>
            <table>
                <thead>
                    <tr>
                        <th>ইউজার</th>
                        <th>টাকা</th>
                        <th>TrxID</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="depositTableBody"></tbody>
            </table>
        </div>

        <div id="withdrawSection" class="section">
            <h1>উইথড্র রিকোয়েস্ট (Pending)</h1>
            <table>
                <thead>
                    <tr>
                        <th>ইউজার</th>
                        <th>টাকা</th>
                        <th>মেথড/নাম্বার</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="withdrawTableBody"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByoyfmwZJyIwYj09NdLwHLpsAVZ0joZq4",
            authDomain: "investmentc12-887a8.firebaseapp.com",
            projectId: "investmentc12-887a8",
            storageBucket: "investmentc12-887a8.firebasestorage.app",
            messagingSenderId: "235522350741",
            appId: "1:235522350741:web:c1c5b9417dd3875e7d059c",
            measurementId: "G-55RG4PR7ZF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ১. ইউজার ইনফরমেশন লোড
        onSnapshot(collection(db, "users"), (snapshot) => {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = "";
            snapshot.forEach(d => {
                const u = d.data();
                tbody.innerHTML += `<tr><td>${u.name}</td><td>${u.email}</td><td style="color:#22c55e; font-weight:bold;">৳${u.balance}</td></tr>`;
            });
        });

        // ২. ডিপোজিট রিকোয়েস্ট লোড
        onSnapshot(collection(db, "transactions"), (snapshot) => {
            const tbody = document.getElementById('depositTableBody');
            tbody.innerHTML = "";
            snapshot.forEach(d => {
                const t = d.data();
                if(t.status === "pending") {
                    tbody.innerHTML += `<tr>
                        <td>${t.userEmail}</td>
                        <td>৳${t.amount}</td>
                        <td style="color:#fbbf24">${t.transactionId}</td>
                        <td>
                            <button class="btn btn-approve" onclick="approveDeposit('${d.id}', '${t.userId}', ${t.amount})">Approve</button>
                            <button class="btn btn-reject" onclick="rejectItem('transactions', '${d.id}')">Delete</button>
                        </td>
                    </tr>`;
                }
            });
        });

        // ৩. উইথড্র রিকোয়েস্ট লোড (যদি 'withdrawals' কালেকশন থাকে)
        onSnapshot(collection(db, "withdrawals"), (snapshot) => {
            const tbody = document.getElementById('withdrawTableBody');
            tbody.innerHTML = "";
            snapshot.forEach(d => {
                const w = d.data();
                if(w.status === "pending") {
                    tbody.innerHTML += `<tr>
                        <td>${w.userEmail}</td>
                        <td>৳${w.amount}</td>
                        <td>${w.method} (${w.number})</td>
                        <td>
                            <button class="btn btn-approve" onclick="approveWithdraw('${d.id}')">Mark Done</button>
                            <button class="btn btn-reject" onclick="rejectItem('withdrawals', '${d.id}')">Delete</button>
                        </td>
                    </tr>`;
                }
            });
        });

        // অ্যাকশন ফাংশনসমূহ
        window.approveDeposit = async (docId, userId, amount) => {
            if(!confirm("টাকা ব্যালেন্সে যোগ করবেন?")) return;
            await updateDoc(doc(db, "users", userId), { balance: increment(amount) });
            await deleteDoc(doc(db, "transactions", docId));
            alert("ডিপোজিট সফল!");
        };

        window.approveWithdraw = async (docId) => {
            if(!confirm("পেমেন্ট কি কমপ্লিট করেছেন?")) return;
            await deleteDoc(doc(db, "withdrawals", docId));
            alert("উইথড্র রিকোয়েস্ট সম্পন্ন!");
        };

        window.rejectItem = async (col, id) => {
            if(confirm("এটি ডিলিট করতে চান?")) await deleteDoc(doc(db, col, id));
        };

        window.showSection = (id, el) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        };
    </script>
</body>
</html>
