<div class="nav-tabs">
    <button class="tab-btn active" onclick="openTab(event, 'userSec')">👥 ইউজার ম্যানেজ</button>
    <button class="tab-btn" onclick="openTab(event, 'paymentSec')">💳 পেমেন্ট সেটিংস</button>
</div>

<div class="container">
    <div id="userSec" class="section active">
        <h4 style="margin-bottom:15px;">সকল ইউজার ও একশন</h4>
        <div id="userList">লোড হচ্ছে...</div>
    </div>

    <div id="paymentSec" class="section">
        <h4 style="margin-bottom:15px;">পেমেন্ট নাম্বার ও টাস্ক আপডেট</h4>
        <div class="card">
            <p>বিকাশ নাম্বার:</p>
            <input type="text" id="bkashNum" placeholder="বিকাশ নাম্বার" class="admin-input">
            <p>নগদ নাম্বার:</p>
            <input type="text" id="nagadNum" placeholder="নগদ নাম্বার" class="admin-input">
            <p>ইউজার টাস্ক লিঙ্ক:</p>
            <input type="text" id="taskLink" placeholder="টাস্ক লিঙ্ক" class="admin-input">
            <button class="btn btn-green" onclick="updateSettings()">সব আপডেট করুন</button>
        </div>
    </div>
</div>

<style>
    .admin-input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
</style>

<script type="module">
    // Firebase imports এবং Config আগের মতোই থাকবে...

    // --- ইউজার ম্যানেজ ফাংশনসমূহ ---
    function loadUserManagement() {
        onSnapshot(collection(db, "users"), (snap) => {
            const list = document.getElementById('userList');
            let html = "";
            snap.forEach(d => {
                const data = d.data();
                html += `
                <div class="card">
                    <p>নাম: <b>${data.name}</b> | ব্যালেন্স: <b>৳${data.balance}</b></p>
                    <p>ইমেল: <b>${data.email}</b></p>
                    <p>অবস্থা: <b>${data.active ? 'একটিভ ✅' : 'ইনএকটিভ ❌'}</b> | ব্যান: <b>${data.banned ? 'হ্যাঁ 🚫' : 'না'}</b></p>
                    
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <button class="btn btn-green" style="font-size:11px; padding:5px;" onclick="changeBalance('${d.id}', 100)">+৳১০০</button>
                        <button class="btn btn-logout" style="font-size:11px; padding:5px;" onclick="changeBalance('${d.id}', -100)">-৳১০০</button>
                        <button class="btn" style="background:#3b82f6; font-size:11px; padding:5px; color:white;" onclick="toggleActive('${d.id}', ${data.active})">${data.active ? 'ডি-একটিভ' : 'একটিভ'}</button>
                        <button class="btn" style="background:#64748b; font-size:11px; padding:5px; color:white;" onclick="toggleBan('${d.id}', ${data.banned || false})">${data.banned ? 'আন-ব্যান' : 'ব্যান'}</button>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
        });
    }

    // টাকা বাড়ানো বা কমানো
    window.changeBalance = async (uid, amount) => {
        await updateDoc(doc(db, "users", uid), { balance: increment(amount) });
        alert("ব্যালেন্স আপডেট হয়েছে।");
    };

    // আইডি একটিভ বা ইনএকটিভ করা
    window.toggleActive = async (uid, currentStatus) => {
        await updateDoc(doc(db, "users", uid), { active: !currentStatus });
    };

    // আইডি ব্যান বা আন-ব্যান করা
    window.toggleBan = async (uid, currentStatus) => {
        await updateDoc(doc(db, "users", uid), { banned: !currentStatus });
        alert("ইউজার স্ট্যাটাস পরিবর্তন হয়েছে।");
    };

    // --- পেমেন্ট নাম্বার ও টাস্ক আপডেট ---
    window.updateSettings = async () => {
        const bkash = document.getElementById('bkashNum').value;
        const nagad = document.getElementById('nagadNum').value;
        const task = document.getElementById('taskLink').value;

        try {
            await setDoc(doc(db, "settings", "appConfig"), {
                bkash: bkash,
                nagad: nagad,
                taskLink: task
            }, { merge: true });
            alert("সব তথ্য আপডেট হয়েছে!");
        } catch(e) {
            alert("ত্রুটি: " + e.message);
        }
    };

    // ডেটা লোড কল করা
    onAuthStateChanged(auth, (user) => {
        if (user) {
            loadUserManagement();
            // সেটিংস থেকে বর্তমান ডাটা লোড করা
            getDoc(doc(db, "settings", "appConfig")).then(d => {
                if(d.exists()){
                    document.getElementById('bkashNum').value = d.data().bkash || "";
                    document.getElementById('nagadNum').value = d.data().nagad || "";
                    document.getElementById('taskLink').value = d.data().taskLink || "";
                }
            });
        }
    });
</script>
