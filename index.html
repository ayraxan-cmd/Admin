<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Invest BD - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        .admin-container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #22c55e; margin-bottom: 30px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .request-info { margin-bottom: 15px; }
        .request-info p { margin: 5px 0; font-size: 14px; }
        .email { color: #94a3b8; }
        .amount { font-size: 18px; color: #22c55e; font-weight: bold; }
        .trxid { background: #0f172a; padding: 4px 8px; border-radius: 4px; color: #fbbf24; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .approve-btn { background: #22c55e; color: white; }
        .reject-btn { background: #ef4444; color: white; }
        #noRequests { text-align: center; color: #64748b; margin-top: 50px; }
        .loading { text-align: center; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>অ্যাডমিন প্যানেল (পেমেন্ট রিকোয়েস্ট)</h1>
        <div id="requestList">
            <p class="loading">লোড হচ্ছে...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByoyfmwZJyIwYj09NdLwHLpsAVZ0joZq4",
            authDomain: "investmentc12-887a8.firebaseapp.com",
            projectId: "investmentc12-887a8",
            storageBucket: "investmentc12-887a8.firebasestorage.app",
            messagingSenderId: "235522350741",
            appId: "1:235522350741:web:c1c5b9417dd3875e7d059c",
            measurementId: "G-55RG4PR7ZF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ১. পেন্ডিং ট্রানজেকশনগুলো রিয়েল-টাইম লোড করা
        const requestListDiv = document.getElementById('requestList');

        onSnapshot(collection(db, "transactions"), (snapshot) => {
            requestListDiv.innerHTML = "";
            let hasData = false;

            snapshot.forEach((documentData) => {
                const data = documentData.data();
                if (data.status === "pending") {
                    hasData = true;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="request-info">
                            <p class="email">ইউজার: ${data.userEmail}</p>
                            <p class="amount">টাকা: ৳ ${data.amount}</p>
                            <p>TrxID: <span class="trxid">${data.transactionId}</span></p>
                            <p style="font-size:12px; color:#64748b">তারিখ: ${new Date(data.date).toLocaleString('bn-BD')}</p>
                        </div>
                        <div class="btn-group">
                            <button class="approve-btn" onclick="approveRequest('${documentData.id}', '${data.userId}', ${data.amount})">অ্যাপ্রুভ করুন</button>
                            <button class="reject-btn" onclick="rejectRequest('${documentData.id}')">ডিলিট</button>
                        </div>
                    `;
                    requestListDiv.appendChild(card);
                }
            });

            if (!hasData) {
                requestListDiv.innerHTML = '<p id="noRequests">কোনো নতুন পেমেন্ট রিকোয়েস্ট নেই।</p>';
            }
        });

        // ২. অ্যাপ্রুভ ফাংশন (ব্যালেন্স আপডেট)
        window.approveRequest = async (transDocId, userId, amount) => {
            if (!confirm("আপনি কি নিশ্চিত যে টাকা পেয়েছেন এবং ব্যালেন্স যোগ করতে চান?")) return;

            try {
                // ইউজারের ব্যালেন্স আপডেট
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    balance: increment(amount)
                });

                // ট্রানজেকশন স্ট্যাটাস আপডেট বা ডিলিট
                await deleteDoc(doc(db, "transactions", transDocId));
                
                alert("সাফল্যের সাথে ব্যালেন্স যোগ করা হয়েছে!");
            } catch (error) {
                console.error(error);
                alert("এরর: " + error.message);
            }
        };

        // ৩. রিজেক্ট ফাংশন
        window.rejectRequest = async (transDocId) => {
            if (!confirm("আপনি কি এই রিকোয়েস্টটি ডিলিট করতে চান?")) return;
            await deleteDoc(doc(db, "transactions", transDocId));
        };
    </script>
</body>
</html>
