<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Invest - Admin Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #22c55e; --bg: #0f172a; --card: #1e293b; --red: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background: var(--bg); color: white; padding: 20px; }
        .header { background: var(--red); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; font-weight: 800; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .btn { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; margin-right: 5px; }
        .btn-approve { background: var(--primary); color: white; }
        .btn-reject { background: var(--red); color: white; }
        .badge { padding: 3px 8px; border-radius: 5px; font-size: 12px; }
        .pending { background: #f59e0b; }
        h3 { margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 5px; color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">Smart Invest Admin Panel</div>

    <div id="depositSection">
        <h3>ডিপোজিট রিকোয়েস্ট (অ্যাক্টিভেশন)</h3>
        <div id="depList">লোডিং...</div>
    </div>

    <div id="withdrawSection" style="margin-top: 30px;">
        <h3>উইথড্র রিকোয়েস্ট</h3>
        <div id="witList">লোডিং...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, getDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByoyfmwZJyIwYj09NdLwHLpsAVZ0joZq4",
            authDomain: "investmentc12-887a8.firebaseapp.com",
            projectId: "investmentc12-887a8",
            storageBucket: "investmentc12-887a8.firebasestorage.app",
            messagingSenderId: "235522350741",
            appId: "1:235522350741:web:c1c5b9417dd3875e7d059c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ১. ডিপোজিট লোড ও রেফার বোনাস লজিক
        onSnapshot(query(collection(db, "transactions"), where("status", "==", "pending")), (snap) => {
            let html = "";
            snap.forEach(d => {
                const data = d.data();
                html += `
                <div class="card">
                    <p>ইউজার: ${data.email}</p>
                    <p>পরিমাণ: ৳${data.amount} | Trx: ${data.trxId}</p>
                    <div style="margin-top:10px;">
                        <button class="btn btn-approve" onclick="approveDeposit('${d.id}', '${data.uid}', ${data.amount})">Approve</button>
                        <button class="btn btn-reject" onclick="rejectDeposit('${d.id}')">Reject</button>
                    </div>
                </div>`;
            });
            document.getElementById('depList').innerHTML = html || "কোনো রিকোয়েস্ট নেই";
        });

        // ৫-স্তর রেফার বোনাস ডিস্ট্রিবিউশন ফাংশন
        async function distributeReferBonus(userUid) {
            const rates = [30, 15, 7.5, 3.75, 1.87]; // ৫ স্তরের বোনাস
            let currentUid = userUid;

            for (let i = 0; i < rates.length; i++) {
                const userRef = doc(db, "users", currentUid);
                const userSnap = await getDoc(userRef);
                
                if (!userSnap.exists()) break;
                const referrerUid = userSnap.data().referrer;

                if (!referrerUid || referrerUid === "") break;

                // রেফারারের অ্যাকাউন্টে বোনাস যোগ করা
                const referrerRef = doc(db, "users", referrerUid);
                await updateDoc(referrerRef, {
                    balance: increment(rates[i])
                });

                // পরের লেভেলের জন্য বর্তমান রেফারারকে সেট করা
                currentUid = referrerUid;
            }
        }

        // ডিপোজিট অ্যাপ্রুভ করার সময় রেফার বোনাস কল হবে
        window.approveDeposit = async (docId, uid, amount) => {
            if(!confirm("আপনি কি নিশ্চিত? এটি একাউন্ট একটিভ করবে এবং ৫-স্তর বোনাস দিবে।")) return;
            
            try {
                // ১. ট্রানজেকশন স্ট্যাটাস আপডেট
                await updateDoc(doc(db, "transactions", docId), { status: "approved" });

                // ২. ইউজারের একাউন্ট একটিভ করা ও ব্যালেন্স যোগ (যদি প্রয়োজন হয়)
                await updateDoc(doc(db, "users", uid), { 
                    active: true,
                    balance: increment(amount) // অথবা নির্দিষ্ট কোনো টাস্ক বোনাস
                });

                // ৩. রেফার বোনাস পাঠানো (৫ স্তর পর্যন্ত)
                await distributeReferBonus(uid);

                alert("সফলভাবে অ্যাপ্রুভ এবং রেফার বোনাস পাঠানো হয়েছে!");
            } catch (e) {
                console.error(e);
                alert("ত্রুটি হয়েছে!");
            }
        };

        window.rejectDeposit = async (id) => {
            if(confirm("বাতিল করতে চান?")) {
                await updateDoc(doc(db, "transactions", id), { status: "rejected" });
            }
        };

        // ২. উইথড্র ম্যানেজমেন্ট
        onSnapshot(query(collection(db, "withdrawals"), where("status", "==", "pending")), (snap) => {
            let html = "";
            snap.forEach(d => {
                const data = d.data();
                html += `
                <div class="card">
                    <p>ইউজার: ${data.email}</p>
                    <p>পরিমাণ: ৳${data.amount} (${data.method})</p>
                    <p>নাম্বার: ${data.number}</p>
                    <div style="margin-top:10px;">
                        <button class="btn btn-approve" onclick="approveWithdraw('${d.id}')">Paid</button>
                        <button class="btn btn-reject" onclick="rejectWithdraw('${d.id}', '${data.uid}', ${data.amount})">Reject</button>
                    </div>
                </div>`;
            });
            document.getElementById('witList').innerHTML = html || "কোনো রিকোয়েস্ট নেই";
        });

        window.approveWithdraw = async (id) => {
            await updateDoc(doc(db, "withdrawals", id), { status: "approved" });
            alert("পেমেন্ট সম্পন্ন!");
        };

        window.rejectWithdraw = async (id, uid, amount) => {
            // রিজেক্ট করলে ইউজারের ব্যালেন্স ফেরত দেওয়া
            await updateDoc(doc(db, "withdrawals", id), { status: "rejected" });
            await updateDoc(doc(db, "users", uid), { balance: increment(amount) });
            alert("রিজেক্ট করা হয়েছে এবং ব্যালেন্স ফেরত দেওয়া হয়েছে।");
        };

    </script>
</body>
</html>
