<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Invest Admin - Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --green: #22c55e; --red: #ef4444; --blue: #3b82f6; --bg: #0f172a; --card: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background: var(--bg); color: white; padding-bottom: 50px; }

        .header { background: var(--card); padding: 20px; text-align: center; border-bottom: 2px solid var(--green); position: sticky; top: 0; z-index: 100; }
        
        .nav-tabs { display: flex; overflow-x: auto; background: var(--card); padding: 10px; gap: 10px; border-bottom: 1px solid #334155; }
        .tab-btn { padding: 10px 20px; border: none; border-radius: 10px; background: #334155; color: #cbd5e1; white-space: nowrap; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: var(--green); color: white; }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }

        .card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid var(--blue); }
        .card p { font-size: 14px; margin-bottom: 5px; color: #cbd5e1; }
        .card b { color: white; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-approve { background: var(--green); color: white; }
        .btn-reject { background: var(--red); color: white; }

        .input-group { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; }
        .input-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header"><h2>Admin Dashboard</h2></div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="openTab(event, 'depositSec')">📥 ডিপোজিট</button>
        <button class="tab-btn" onclick="openTab(event, 'withdrawSec')">📤 উইথড্র</button>
        <button class="tab-btn" onclick="openTab(event, 'taskSec')">🎯 টাস্ক সেটিং</button>
        <button class="tab-btn" onclick="openTab(event, 'userSec')">👥 ইউজার</button>
    </div>

    <div class="container">
        
        <div id="depositSec" class="section active">
            <h3 style="margin-bottom: 15px;">পেন্ডিং ডিপোজিট</h3>
            <div id="depositList">লোড হচ্ছে...</div>
        </div>

        <div id="withdrawSec" class="section">
            <h3 style="margin-bottom: 15px;">পেন্ডিং উইথড্র</h3>
            <div id="withdrawList">লোড হচ্ছে...</div>
        </div>

        <div id="taskSec" class="section">
            <h3 style="margin-bottom: 15px;">ডেইলি টাস্ক কন্ট্রোল</h3>
            <div class="input-group">
                <input type="text" id="taskUrl" placeholder="টাস্ক লিঙ্ক দিন (URL)">
                <button class="btn btn-green" onclick="updateTask()">লিঙ্ক আপডেট করুন</button>
            </div>
            <p style="margin-top: 10px; font-size: 12px; color: #94a3b8;">* এই লিঙ্কটি সকল ইউজারের টাস্ক বাটনে সেট হয়ে যাবে।</p>
        </div>

        <div id="userSec" class="section">
            <h3 style="margin-bottom: 15px;">ইউজার অ্যাক্টিভেশন</h3>
            <div id="userList">লোড হচ্ছে...</div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByoyfmwZJyIwYj09NdLwHLpsAVZ0joZq4",
            authDomain: "investmentc12-887a8.firebaseapp.com",
            projectId: "investmentc12-887a8",
            storageBucket: "investmentc12-887a8.firebasestorage.app",
            messagingSenderId: "235522350741",
            appId: "1:235522350741:web:c1c5b9417dd3875e7d059c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.openTab = (evt, sectionId) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            evt.currentTarget.classList.add('active');
        };

        // 1. Deposit Management Logic
        onSnapshot(collection(db, "transactions"), (snap) => {
            const list = document.getElementById('depositList');
            list.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                if(data.status === "pending") {
                    const card = document.createElement('div');
                    card.className = "card";
                    card.innerHTML = `
                        <p>ইমেল: <b>${data.email}</b></p>
                        <p>মেথড: <b>${data.method}</b> | পরিমাণ: <b>৳${data.amount}</b></p>
                        <p>TrxID: <b style="color:var(--green)">${data.trxId}</b></p>
                        <div class="btn-row">
                            <button class="btn btn-approve" onclick="approveDep('${d.id}', '${data.uid}', ${data.amount})">Approve</button>
                            <button class="btn btn-reject" onclick="rejectReq('transactions', '${d.id}')">Reject</button>
                        </div>
                    `;
                    list.appendChild(card);
                }
            });
        });

        window.approveDep = async (id, uid, amount) => {
            if(!confirm("ব্যালেন্স ও একাউন্ট একটিভ করবেন?")) return;
            await updateDoc(doc(db, "users", uid), { balance: increment(amount), active: true });
            await updateDoc(doc(db, "transactions", id), { status: "approved" });
            alert("সফল হয়েছে!");
        };

        // 2. Withdraw Management Logic
        onSnapshot(collection(db, "withdrawals"), (snap) => {
            const list = document.getElementById('withdrawList');
            list.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                if(data.status === "pending") {
                    const card = document.createElement('div');
                    card.className = "card";
                    card.style.borderLeftColor = "var(--red)";
                    card.innerHTML = `
                        <p>ইমেল: <b>${data.email}</b></p>
                        <p>মেথড: <b>${data.method}</b> | নাম্বার: <b>${data.number}</b></p>
                        <p>পরিমাণ: <b>৳${data.amount}</b></p>
                        <div class="btn-row">
                            <button class="btn btn-approve" onclick="updateStatus('withdrawals', '${d.id}', 'paid')">Paid ✅</button>
                            <button class="btn btn-reject" onclick="rejectReq('withdrawals', '${d.id}')">Delete</button>
                        </div>
                    `;
                    list.appendChild(card);
                }
            });
        });

        // 3. Task Management Logic
        window.updateTask = async () => {
            const url = document.getElementById('taskUrl').value;
            if(!url) return alert("লিঙ্ক দিন");
            await setDoc(doc(db, "settings", "taskConfig"), { url: url });
            alert("টাস্ক আপডেট হয়েছে!");
        };

        // 4. User List Logic (Manual Activation)
        onSnapshot(collection(db, "users"), (snap) => {
            const list = document.getElementById('userList');
            list.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                const card = document.createElement('div');
                card.className = "card";
                card.style.borderLeftColor = data.active ? "var(--green)" : "var(--red)";
                card.innerHTML = `
                    <p>নাম: <b>${data.name}</b></p>
                    <p>ইমেল: <b>${data.email}</b></p>
                    <p>ব্যালেন্স: <b>৳${data.balance}</b></p>
                    <p>স্ট্যাটাস: <b>${data.active ? 'Active ✅' : 'Inactive ❌'}</b></p>
                    <button class="btn" style="background:#334155; color:white; width:100%; margin-top:10px" 
                        onclick="toggleUserStatus('${d.id}', ${data.active})">
                        ${data.active ? 'Deactivate' : 'Activate User'}
                    </button>
                `;
                list.appendChild(card);
            });
        });

        window.toggleUserStatus = async (uid, current) => {
            await updateDoc(doc(db, "users", uid), { active: !current });
        };

        window.updateStatus = async (coll, id, status) => {
            await updateDoc(doc(db, coll, id), { status: status });
            alert("Status Updated!");
        };

        window.rejectReq = async (coll, id) => {
            if(confirm("ডিলিট করতে চান?")) await deleteDoc(doc(db, coll, id));
        };

    </script>
</body>
</html>
