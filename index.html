<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Smart Invest BD</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #22c55e; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

        /* Navigation Bar */
        .admin-nav { 
            display: flex; justify-content: space-around; background: var(--card); 
            padding: 15px 0; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #334155;
        }
        .nav-item { color: #94a3b8; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.3s; }
        .nav-item.active { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 5px; }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }

        /* Cards & Tables */
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        h2 { font-size: 20px; color: var(--primary); margin-bottom: 15px; border-left: 4px solid var(--primary); padding-left: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; }

        /* Inputs & Buttons */
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-prime { background: var(--primary); color: white; }
        .btn-action { padding: 5px 10px; font-size: 12px; border-radius: 5px; margin-right: 5px; }
        .btn-approve { background: #10b981; color: white; }
        .btn-delete { background: #ef4444; color: white; }

        @keyframes fadeIn { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
    </style>
</head>
<body>

    <div class="admin-nav">
        <div class="nav-item active" onclick="showSection('taskSec', this)">টাস্ক</div>
        <div class="nav-item" onclick="showSection('userSec', this)">ইউজার</div>
        <div class="nav-item" onclick="showSection('depSec', this)">ডিপোজিট</div>
        <div class="nav-item" onclick="showSection('witSec', this)">উইথড্র</div>
    </div>

    <div class="container">
        
        <div id="taskSec" class="section active">
            <div class="card">
                <h2>🎯 ডেইলি টাস্ক কন্ট্রোল</h2>
                <label style="font-size: 14px; color:#94a3b8;">কাজের লিংক:</label>
                <input type="text" id="taskUrlInput" placeholder="https://youtube.com/...">
                <button class="btn btn-prime" onclick="updateTaskLink()">লিংক আপডেট করুন</button>
            </div>
        </div>

        <div id="userSec" class="section">
            <div class="card">
                <h2>👥 ইউজার ম্যানেজমেন্ট</h2>
                <table>
                    <thead>
                        <tr><th>নাম/ইমেল</th><th>ব্যালেন্স</th><th>অ্যাকশন</th></tr>
                    </thead>
                    <tbody id="userTable"></tbody>
                </table>
            </div>
        </div>

        <div id="depSec" class="section">
            <div class="card">
                <h2>📥 পেমেন্ট রিকোয়েস্ট</h2>
                <table>
                    <thead>
                        <tr><th>ইমেল</th><th>পরিমাণ</th><th>TrxID</th><th>অ্যাকশন</th></tr>
                    </thead>
                    <tbody id="depositTable"></tbody>
                </table>
            </div>
        </div>

        <div id="witSec" class="section">
            <div class="card">
                <h2>📤 উইথড্র রিকোয়েস্ট</h2>
                <table>
                    <thead>
                        <tr><th>ইমেল</th><th>পরিমাণ</th><th>নাম্বার</th><th>অ্যাকশন</th></tr>
                    </thead>
                    <tbody id="withdrawTable"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByoyfmwZJyIwYj09NdLwHLpsAVZ0joZq4",
            authDomain: "investmentc12-887a8.firebaseapp.com",
            projectId: "investmentc12-887a8",
            storageBucket: "investmentc12-887a8.firebasestorage.app",
            messagingSenderId: "235522350741",
            appId: "1:235522350741:web:c1c5b9417dd3875e7d059c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- Navigation Logic ---
        window.showSection = (id, el) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        };

        // --- Task Control ---
        window.updateTaskLink = async () => {
            const url = document.getElementById('taskUrlInput').value;
            await setDoc(doc(db, "settings", "taskConfig"), { url: url }, { merge: true });
            alert("টাস্ক লিংক আপডেট হয়েছে!");
        };

        // --- User List ---
        onSnapshot(collection(db, "users"), (snap) => {
            const table = document.getElementById('userTable');
            table.innerHTML = "";
            snap.forEach(d => {
                const u = d.data();
                table.innerHTML += `<tr>
                    <td>${u.name}<br><small>${u.email}</small></td>
                    <td>৳${u.balance}</td>
                    <td><button class="btn-action btn-delete" onclick="deleteUser('${d.id}')">ব্যান</button></td>
                </tr>`;
            });
        });

        // --- Deposit Management ---
        onSnapshot(collection(db, "transactions"), (snap) => {
            const table = document.getElementById('depositTable');
            table.innerHTML = "";
            snap.forEach(d => {
                const t = d.data();
                if(t.status === "pending") {
                    table.innerHTML += `<tr>
                        <td>${t.userEmail}</td>
                        <td>৳${t.amount}</td>
                        <td><small>${t.transactionId}</small></td>
                        <td><button class="btn-action btn-approve" onclick="approveDep('${d.id}', '${t.userId}', ${t.amount})">Approve</button></td>
                    </tr>`;
                }
            });
        });

        // --- Withdraw Management ---
        onSnapshot(collection(db, "withdrawals"), (snap) => {
            const table = document.getElementById('withdrawTable');
            table.innerHTML = "";
            snap.forEach(d => {
                const w = d.data();
                if(w.status === "pending") {
                    table.innerHTML += `<tr>
                        <td>${w.userEmail}</td>
                        <td>৳${w.amount}</td>
                        <td>${w.number}</td>
                        <td><button class="btn-action btn-approve" onclick="completeWit('${d.id}')">Done</button></td>
                    </tr>`;
                }
            });
        });

        // --- Action Functions ---
        window.approveDep = async (docId, uId, amt) => {
            await updateDoc(doc(db, "users", uId), { balance: increment(amt) });
            await deleteDoc(doc(db, "transactions", docId));
            alert("ডিপোজিট সফল!");
        };

        window.completeWit = async (id) => {
            await deleteDoc(doc(db, "withdrawals", id));
            alert("উইথড্র সম্পন্ন!");
        };

        window.deleteUser = async (id) => {
            if(confirm("এই ইউজারকে কি ব্যান করতে চান?")) await deleteDoc(doc(db, "users", id));
        };
    </script>
</body>
</html>
